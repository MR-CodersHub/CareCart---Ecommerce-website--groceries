<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareCart - Create Account</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
    <link rel="icon" href="assets/images/carecart_logo.png">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
</head>
<body>

  <!-- ================= AUTH CONTAINER ================= -->
  <main class="auth-page">
    <div class="auth-wrapper">
      <div class="auth-card">

        <!-- LEFT HERO PANEL -->
        <div class="auth-hero-panel">
          <img
            src="assets/images/heroo_img.png"
            alt="CareCart - Fresh Groceries & Care"
            class="auth-hero-img"
          />
        </div>

        <!-- RIGHT FORM PANEL -->
        <div class="auth-form-panel">
          <div class="auth-form-container">
            
            <!-- BRAND LOGO & NAME -->
            <a href="index.html" class="auth-brand">
              <img src="assets/images/carecart_logo.png" alt="CareCart Logo">
              <span>CareCart</span>
            </a>

            <h2 class="auth-form-title">Create Account</h2>
            <p class="auth-form-subtitle">Create your CareCart account to get started.</p>

            <!-- ERROR ALERT -->
            <div id="registerErrorAlert" class="auth-alert alert-error hidden"></div>

            <!-- SUCCESS ALERT -->
            <div id="registerSuccessAlert" class="auth-alert alert-success hidden"></div>

            <!-- FORM -->
            <form id="registerForm" class="auth-form">
              
              <!-- FULL NAME -->
              <div class="form-group">
                <label for="regName">Full Name</label>
                <input
                  type="text"
                  id="regName"
                  name="name"
                  placeholder="Enter your full name"
                  required
                />
              </div>

              <!-- EMAIL -->
              <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input
                  type="email"
                  id="regEmail"
                  name="email"
                  placeholder="you@example.com"
                  required
                />
              </div>

              <!-- PASSWORD -->
              <div class="form-group">
                <label for="regPassword">Password</label>
                <div class="password-input-wrapper">
                  <input
                    type="password"
                    id="regPassword"
                    name="password"
                    placeholder="Create a password"
                    required
                  />
                  <button type="button" id="toggleRegPasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility">
                    <i data-lucide="eye" id="toggleRegPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <!-- CONFIRM PASSWORD -->
              <div class="form-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <div class="password-input-wrapper">
                  <input
                    type="password"
                    id="regConfirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                  />
                  <button type="button" id="toggleRegConfirmPasswordBtn" class="password-toggle-btn" aria-label="Toggle confirm password visibility">
                    <i data-lucide="eye" id="toggleRegConfirmPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <!-- SUBMIT -->
              <button type="submit" class="btn-auth-submit">
                <i data-lucide="user-plus"></i>
                <span>Create Account</span>
              </button>
            </form>

            <!-- LOGIN LINK -->
            <p class="auth-switch-text">
              Already have an account?
              <a href="login.html" class="auth-switch-link">Login</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </main>


  <script src="js/main.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
